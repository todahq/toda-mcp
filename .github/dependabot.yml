# Keeps the actions ci.yml pins by commit SHA current (the version is the comment after each pin).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The package's npm dependencies. Minor and patch bumps arrive as one grouped pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
